name: Release

# Tag v* → signed GoReleaser build → GitHub release → HCP Terraform private registry
# (bsg-kcare/atlassian). Secrets: GPG_PRIVATE_KEY (ASCII-armored, no passphrase),
# TFC_TOKEN (user or team token with "Manage Private Registry").

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Publish to HCP Terraform private registry
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          TFC_ORG: bsg-kcare
        run: |
          gpg --armor --export "${{ steps.import_gpg.outputs.fingerprint }}" > /tmp/pubkey.asc
          GPG_PUBKEY_FILE=/tmp/pubkey.asc scripts/publish-tfc.sh "$TFC_ORG" atlassian "${GITHUB_REF_NAME#v}" dist
